name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  default: minor
template: |
  ## What's new since $PREVIOUS_TAG

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION

  $CONTRIBUTORS

  ---

  ## Release assets

  | File | Description |
  |------|-------------|
  | `Prompty.php` | Full class with comments |
  | `Prompty.min.php` | Minified - comments stripped, class body on 1 line |
  | `Prompty.compact.php` | Compacted - minified + shortened internals (~60% smaller) |
  | `Prompty.min.payload`, `Prompty.compact.payload` | The exact code `embed.php` writes between the markers, in each mode |
  | `PromptyTestTrait.php` | PHPUnit helper for testing scripts that use Prompty |
  | `starter.php` | Example script template |
  | `embed.php` | Embed/minify helper |
  | `SHA256SUMS`, `SHA256SUMS.asc` | Checksums of the PHP files and payloads, and their GPG signature |
  | `Prompty.intoto.jsonl` | Build provenance attestation for the PHP files, payloads and `SHA256SUMS` |

  ## Verifying release assets

  Download the asset files, `SHA256SUMS`, and `SHA256SUMS.asc` into the same
  directory, then:

  ```bash
  # Fetch the public key by its fingerprint (first time only).
  gpg --keyserver hkps://keys.openpgp.org \
    --recv-keys 755E824E80F849135F5F4043E71EDB25C4F6D89D

  # Verify the signature.
  gpg --verify SHA256SUMS.asc SHA256SUMS

  # Verify file checksums.
  sha256sum -c SHA256SUMS
  ```

  The expected fingerprint, and what this check does and does not prove, are in [SECURITY.md](https://github.com/$OWNER/$REPOSITORY/blob/main/SECURITY.md#verifying-a-release).
