name: Audit

on:
  schedule:
    - cron: '37 5 * * 1'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  branch_protection_rule:

permissions: {}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      id-token: write # Sign the results published to the Scorecard API.
      security-events: write # Upload the results to code scanning.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit security practices with OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The archive omits 'export-ignore' paths such as '.github'.
          file_mode: git
          # The Scorecard API accepts results from the default branch only.
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Upload the audit results to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

  security:
    name: Security
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'branch_protection_rule' }}

    permissions:
      actions: read
      contents: read
      security-events: write # Upload the results to code scanning.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # CodeQL has no PHP extractor, so it scans the workflows only.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: actions
          build-mode: none

      - name: Scan workflows for vulnerabilities with CodeQL
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

      - name: Scan PHP code for vulnerabilities with Semgrep
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1 semgrep scan --config p/php --metrics=off --sarif --output semgrep.sarif

      - name: Upload the Semgrep results to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
