name: Test PHP

on:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint, ubuntu-latest
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-normal-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --audit

      - name: Validate composer.json
        run: |
          composer --verbose validate
          composer normalize --dry-run

      - name: Check coding standards
        run: composer lint
        continue-on-error: ${{ vars.CI_LINT_IGNORE_FAILURE == '1' }}

  check-embed-release:
    name: Check embed release, ubuntu-latest
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'

      # Builds the assets the release workflow builds, without signing them.
      - name: Build release assets
        run: |
          mkdir -p .artifacts/release
          cp Prompty.php embed.php starter.php .artifacts/release/
          cd .artifacts/release
          sed -i "s/__PROMPTY_VERSION__/0.0.0-ci/g" Prompty.php
          php embed.php --payload Prompty.min.payload
          php embed.php --compact --payload Prompty.compact.payload
          sha256sum Prompty.min.payload Prompty.compact.payload embed.php > SHA256SUMS

      - name: Check embedding from the release assets
        run: php .util/check-embed-release.php .artifacts/release

  test-php:
    name: PHP ${{ matrix.php-versions }}, Deps ${{ matrix.deps }}, ubuntu-latest
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # Post the coverage summary as a PR comment.

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.3', '8.4', '8.5']
        deps: ['normal', 'lowest']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ matrix.deps }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: pcov
          ini-values: pcov.directory=.

      - name: Install dependencies
        env:
          DEPS: ${{ matrix.deps }}
          PLATFORM_FLAG: ${{ matrix.php-versions == '8.5' && '--ignore-platform-reqs' || '' }}
        run: |
          if [[ "${DEPS}" == "lowest" ]]; then
            composer update --prefer-lowest --prefer-stable ${PLATFORM_FLAG:+"${PLATFORM_FLAG}"}
          else
            composer install --audit ${PLATFORM_FLAG:+"${PLATFORM_FLAG}"}
          fi

      - name: Validate composer.json
        run: |
          composer --verbose validate
          composer normalize --dry-run

      - name: Run tests
        run: composer test-coverage
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      # Each Enter accepts a widget's default, and the end of the input cancels
      # any widget still waiting, so no script blocks.
      - name: Run playground scripts
        run: |
          for script in playground/*.php; do
            echo "::group::${script}"
            status=0
            printf '\n%.0s' {1..10} | php -d error_reporting=-1 -d display_errors=stderr "${script}" 2> "${RUNNER_TEMP}/stderr.txt" || status=$?
            echo "::endgroup::"
            if [[ "${status}" -ne 0 || -s "${RUNNER_TEMP}/stderr.txt" ]]; then
              echo "${script} exited with code ${status}."
              cat "${RUNNER_TEMP}/stderr.txt"
              exit 1
            fi
          done

      - name: Check code coverage threshold
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal'
        run: |
          RATE=$(grep -o 'line-rate="[0-9.]*"' .logs/cobertura.xml | head -1 | tr -cd '0-9.')
          PERCENT=$(awk "BEGIN {printf \"%.2f\", $RATE*100}")
          echo "Coverage: $PERCENT% (threshold: $CI_CODE_COVERAGE_THRESHOLD%)"
          if [[ ${PERCENT//./} -lt $((CI_CODE_COVERAGE_THRESHOLD*100)) ]]; then
            echo "FAIL: coverage too low"
            exit 1
          fi
          { echo "COVERAGE_CONTENT<<EOF"; sed '/./,$!d' .logs/coverage.txt; echo "EOF"; } >> "$GITHUB_ENV"
        env:
          CI_CODE_COVERAGE_THRESHOLD: ${{ vars.CI_CODE_COVERAGE_THRESHOLD || '80' }}

      - name: Post coverage summary as PR comment
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          message: |
            ```
            ${{ env.COVERAGE_CONTENT }}
            ```
          # Post a new comment every time to keep the coverage history.
          hide_and_recreate: true

      - name: Upload coverage report as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{github.job}}-code-coverage-report-${{ matrix.php-versions }}-${{ matrix.deps }}
          path: .logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal' && env.CODECOV_TOKEN != ''
        with:
          files: .logs/junit.xml
          report_type: test_results
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal' && env.CODECOV_TOKEN != ''
        with:
          files: .logs/cobertura.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-php-os:
    name: PHP ${{ matrix.php-versions }}, Deps normal, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: ['macos-26', 'macos-15', 'windows-2025', 'windows-2022']
        php-versions: ['8.3', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none

      - name: Install dependencies
        shell: bash
        env:
          PLATFORM_FLAG: ${{ matrix.php-versions == '8.5' && '--ignore-platform-reqs' || '' }}
        run: composer install --audit ${PLATFORM_FLAG:+"${PLATFORM_FLAG}"}

      - name: Run tests
        run: composer test
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

