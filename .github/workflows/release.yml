name: Release assets

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

# Releases share Release Drafter's single draft, so 2 runs must not overlap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload release assets, ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The signing key is an environment secret, so a reviewer approves each
    # run before the job can read it.
    environment: release

    permissions:
      actions: read # Wait for Release Drafter to finish.
      contents: write # Upload the assets and publish the release.
      id-token: write # Sign the attestations.
      attestations: write # Record the attestations.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' is not a version."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag '${TAG}' points to a commit that is not on main."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'

      - name: Imprint version
        env:
          TAG: ${{ github.ref_name }}
        run: sed -i "s/__PROMPTY_VERSION__/${TAG}/g" Prompty.php

      - name: Verify starter script
        run: |
          echo -e "test\n\n\n\n" | php starter.php
          echo "Starter script verified."

      - name: Build minimized class
        run: php embed.php --stdout Prompty.min.php

      - name: Build compacted class
        run: php embed.php --compact --stdout Prompty.compact.php

      - name: Build embed payloads
        run: |
          php embed.php --payload Prompty.min.payload
          php embed.php --compact --payload Prompty.compact.payload

      - name: Generate checksums
        run: sha256sum Prompty.php Prompty.min.php Prompty.compact.php Prompty.min.payload Prompty.compact.payload PromptyTestTrait.php starter.php embed.php > SHA256SUMS

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Sign checksums
        run: gpg --batch --yes --detach-sign --armor SHA256SUMS

      - name: Verify signature before upload
        run: |
          gpg --import PUBLIC_KEY.asc
          gpg --verify SHA256SUMS.asc SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            Prompty.php
            Prompty.min.php
            Prompty.compact.php
            Prompty.min.payload
            Prompty.compact.payload
            PromptyTestTrait.php
            starter.php
            embed.php
            SHA256SUMS

      # Assets go onto a draft, because a published release is immutable.
      - name: Upload the assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PROVENANCE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "${PROVENANCE}" Prompty.intoto.jsonl

          # The merge that precedes the tag starts Release Drafter, which sets
          # its draft's tag back to its own guess. Only the run for the tagged
          # commit matters, and a run GitHub never starts stays queued forever.
          for run in $(gh run list --workflow draft-release-notes.yml --commit "${GITHUB_SHA}" --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId'); do
            timeout 600 gh run watch "${run}" > /dev/null || true
          done

          state="$(gh release view "${TAG}" --json isDraft --jq 'if .isDraft then "draft" else "published" end' || echo 'none')"

          if [ "${state}" = 'published' ]; then
            echo "::error::Release '${TAG}' is already published, so its assets can't change."
            exit 1
          fi

          # Release Drafter names its draft after the version it guesses, which
          # can differ from the pushed tag. A prerelease leaves the draft for
          # the final release.
          draft=''
          if [ "${state}" = 'none' ] && [[ "${TAG}" != *-* ]]; then
            draft="$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft) | .tagName][0] // empty')"
          fi

          if [ -n "${draft}" ]; then
            gh release edit "${draft}" --tag "${TAG}" --title "${TAG}"
          elif [ "${state}" = 'none' ]; then
            gh release create "${TAG}" --title "${TAG}" --generate-notes --draft --verify-tag
          fi

          gh release upload "${TAG}" \
            Prompty.php \
            Prompty.min.php \
            Prompty.compact.php \
            Prompty.min.payload \
            Prompty.compact.payload \
            PromptyTestTrait.php \
            starter.php \
            embed.php \
            SHA256SUMS \
            SHA256SUMS.asc \
            Prompty.intoto.jsonl \
            --clobber

      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p verify
          cd verify
          gh release download "${TAG}"
          gpg --verify SHA256SUMS.asc SHA256SUMS
          sha256sum -c SHA256SUMS
          for asset in Prompty.php Prompty.min.php Prompty.compact.php Prompty.min.payload Prompty.compact.payload PromptyTestTrait.php starter.php embed.php SHA256SUMS; do
            gh attestation verify "${asset}" --repo "${GH_REPO}" --signer-workflow "${GH_REPO}/.github/workflows/release.yml"
            gh attestation verify "${asset}" --repo "${GH_REPO}" --bundle Prompty.intoto.jsonl
          done

      # Embeds the downloaded class with the downloaded embedder, as a
      # consumer does, and checks the result against the downloaded sums.
      - name: Check embedding from the uploaded assets
        run: php .util/check-embed-release.php verify

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease='false'
          if [[ "${TAG}" == *-* ]]; then
            prerelease='true'
          fi

          # A release for an older version must not take "latest" from a newer one.
          latest='false'
          if [ "${prerelease}" = 'false' ]; then
            if ! tags="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')"; then
              echo '::error::Could not list the published releases.'
              exit 1
            fi
            highest="$(printf '%s\n%s\n' "${tags}" "${TAG}" | sort -V | tail -n 1)"
            if [ "${highest}" = "${TAG}" ]; then
              latest='true'
            fi
          fi

          # The compare link ends on Release Drafter's guess. Read the guess from
          # the body, because a re-run doesn't know which draft it renamed.
          notes="$(gh release view "${TAG}" --json body --jq .body)"
          if [[ "${notes}" =~ /compare/[0-9A-Za-z.-]+\.\.\.([0-9A-Za-z.-]+) ]]; then
            guess="${BASH_REMATCH[1]}"
            notes="${notes//"...${guess}"/"...${TAG}"}"
          fi
          printf '%s\n' "${notes}" > "${RUNNER_TEMP}/notes.md"

          gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md" --draft=false --prerelease="${prerelease}" --latest="${latest}" --verify-tag
